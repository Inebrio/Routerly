name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# contents: write covers tag creation, release publishing and the docs commit push.
# pull-requests: write covers the changesets "Version Packages" PR step.
# Reusable workflow calls below (docs-deploy, promote-stable) run as jobs of this
# workflow and are capped by this same block; secrets: inherit only propagates
# secrets, not permissions, so neither called workflow needs its own grant here.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
      version: ${{ steps.tag.outputs.version }}
      # Falls back to the default-promotion step's "false" when the tag step is
      # skipped (hasChangesets == 'true'), whose own output would otherwise be
      # empty. Empty already evaluates falsy against == 'true', so this fallback
      # is for an explicit "false" rather than relying on emptiness alone.
      promoted: ${{ steps.tag.outputs.promoted || steps.default-promotion.outputs.promoted }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so changeset can detect previous tags
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update "Version Packages" PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs when no changesets are pending (i.e. after the Version PR is merged).
      # Idempotent: skips silently if the tag already exists.
      - name: Build all packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: npm run build

      - name: Render release notes
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          PREVIOUS_REF=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null) \
            || PREVIOUS_REF=$(git rev-list --max-parents=0 HEAD)
          scripts/release-notes.sh "$PREVIOUS_REF" HEAD > RELEASE_NOTES.md

      # Defaults the job's promoted output to false so a run that never reaches
      # this step (hasChangesets == 'true') still gates downstream jobs off.
      - name: Default promoted output
        id: default-promotion
        run: echo "promoted=false" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/service/package.json').version")
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          ARCHIVE="routerly-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="routerly-${VERSION}/" \
            --output="${ARCHIVE}" HEAD

          gh release create "$TAG" \
            --title "Routerly ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${ARCHIVE}" \
            scripts/install.sh \
            scripts/install.ps1 \
            scripts/install.mjs

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.promoted == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: |
          VERSION=$(node -p "require('./packages/service/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            inebrio/routerly:latest
            inebrio/routerly:v${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.promoted == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cut documentation version
        run: npm run docs:cut -- ${{ needs.release.outputs.version }}

      - name: Commit and push documentation version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "chore(docs): cut documentation version ${{ needs.release.outputs.version }}"
            git push origin main
          fi

  docs-deploy:
    name: Deploy Docs
    needs: [release, docs]
    if: needs.release.outputs.promoted == 'true'
    uses: ./.github/workflows/docs-deploy.yml
    secrets: inherit

  stable:
    name: Promote Stable Channel
    needs: [release, docker]
    if: needs.release.outputs.promoted == 'true'
    uses: ./.github/workflows/promote-stable.yml
    with:
      version: v${{ needs.release.outputs.version }}
    secrets: inherit
