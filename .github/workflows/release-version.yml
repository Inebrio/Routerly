name: Release Version

on:
  push:
    branches: ['release/**']

concurrency: release-version-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard against prerelease mode
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::Prerelease mode is not used on this line. Exit it with 'npx changeset pre exit' before pushing this release branch."
            exit 1
          fi

      - name: Create or update Version PR
        uses: changesets/action@v1.9.0
        with:
          version: npm run version
          title: "chore: version packages"
          commit: "chore: version packages"
          branch: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
