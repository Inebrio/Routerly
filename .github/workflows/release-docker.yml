name: Release Docker Prerelease

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ['release/**']

concurrency: release-docker-${{ github.event.workflow_run.head_branch }}

permissions:
  contents: read
  statuses: write

jobs:
  docker:
    name: Build and push prerelease Docker image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: meta
        id: meta
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          VERSION=$(node -p "require('./packages/service/package.json').version")
          TAG="v${VERSION}-rc.${RUN_NUMBER}"
          {
            echo "version=${VERSION}"
            echo "run=${RUN_NUMBER}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: inebrio/routerly:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Prerelease image published"
          else
            STATE="failure"
            DESCRIPTION="Prerelease image publish failed"
          fi

          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="release-docker" \
            -f description="${DESCRIPTION}" \
            -f target_url="${TARGET_URL}"
