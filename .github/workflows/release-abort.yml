name: Release Abort

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to abort, e.g. v0.5.0 or 0.5.0 (both accepted). Deletes its prerelease tags only.'
        required: true

concurrency: release-abort

permissions:
  contents: read

jobs:
  abort:
    name: Delete prerelease tags for an abandoned release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run release abort
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/release-abort.mjs --version "$INPUT_VERSION"
