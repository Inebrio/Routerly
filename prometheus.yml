global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: routerly
    static_configs:
      - targets: ['localrouter:3000']
    metrics_path: /metrics
    # If prometheusAuthToken is set in Routerly settings, uncomment and set:
    # authorization:
    #   credentials: your-token-here
